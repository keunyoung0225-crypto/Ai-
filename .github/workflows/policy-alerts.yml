# 관심 키워드 공고 알림: 매일 아침 9시(한국 시각)에 휴대폰으로 알림 (ntfy 앱)
# 설정 방법은 README의 '휴대폰 알림' 참고
name: 관심 키워드 공고 알림

on:
  schedule:
    # 매일 08:30(한국 시각)에 실행하고, 알림은 ntfy 예약 발송으로 09:00에 도착
    # GitHub 예약 실행은 몇 분~수십 분 늦을 수 있어 미리 실행합니다.
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '이 날짜부터 올라온 공고 확인 (YYYY-MM-DD, 비우면 어제)'
        required: false
      dry_run:
        description: '알림을 보내지 않고 결과만 확인'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 키워드 공고 확인 및 알림 발송
        run: node scripts/notify.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 알림 받을 사람을 늘리려면: Secrets에 NTFY_TOPIC_2 등을 추가하고 아래에도 한 줄 추가
          # NTFY_TOPIC_2: ${{ secrets.NTFY_TOPIC_2 }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SITE_URL: ${{ vars.SITE_URL }}
          POLICY_DATA_URL: ${{ vars.POLICY_DATA_URL }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
          # 수동 실행은 예약 없이 바로 발송
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' }}
