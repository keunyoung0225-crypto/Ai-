<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 모아보는 정책한눈</title>
  <meta name="description" content="수의계약·위수탁지원사업 등 2026년 정책 공고를 한곳에서 검색합니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
  <script>
    // 저장된 화면 모드를 CSS보다 먼저 적용해 깜빡임 방지 (키는 config.js의 STORAGE_KEYS.theme과 같음)
    try {
      const theme = localStorage.getItem('policyMoa.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#results">검색 결과로 바로가기</a>

  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__bar">
        <span class="site-brand">
          <span class="site-brand__mark" aria-hidden="true">한눈</span>
          <span class="site-brand__text">2026 정책 공고 검색</span>
        </span>
        <div class="site-header__tools">
          <div id="notify-settings"></div>
          <div id="theme-toggle"></div>
        </div>
      </div>
      <div class="site-header__intro" id="app-header">
        <h1 class="site-title">2026년 모아보는 정책한눈</h1>
      </div>
      <dl class="summary-stats" id="summary-stats" hidden></dl>
    </div>
  </header>

  <div class="page-layout">
    <!-- PC 화면 왼쪽 광고 영역 (넓은 화면에서만 보임) -->
    <aside class="ad-slot ad-slot--side" id="ad-side" aria-label="광고"></aside>

  <main class="container">
    <div class="deadline-alert" id="deadline-alert" hidden></div>

    <section class="card region-explorer" id="region-explorer"></section>

    <section class="card recent-search" id="recent-search" hidden></section>

    <nav class="category-tabs" id="category-tabs" aria-label="검색유형"></nav>

    <section class="card" id="search-form" aria-label="검색 조건"></section>

    <section class="card" id="results" tabindex="-1" aria-label="검색 결과">
      <div class="result-toolbar">
        <p class="result-summary" id="result-summary" aria-live="polite"></p>
        <div class="active-region" id="active-region"></div>
        <div class="result-actions" id="result-actions"></div>
        <div class="sort-select" id="sort-select"></div>
      </div>
      <div id="result-table"></div>
      <div class="load-more-wrap" id="load-more"></div>
    </section>

    <p class="notice" id="data-notice">※ 화면에 표시된 공고는 시연용 가상 데이터입니다.</p>
    <p class="notice notice--credit">지도: <a href="https://github.com/VictorCazanave/svg-maps" target="_blank" rel="noopener noreferrer">svg-maps/south-korea</a> (Victor Cazanave, CC BY 4.0)</p>

    <noscript>
      <p class="notice">이 서비스를 이용하려면 브라우저에서 JavaScript를 켜 주세요.</p>
    </noscript>
  </main>
  </div>

  <!-- 휴대폰 화면 맨 아래 광고 영역 (좁은 화면에서만 보임) -->
  <aside class="ad-slot ad-slot--bottom" id="ad-bottom" aria-label="광고"></aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
